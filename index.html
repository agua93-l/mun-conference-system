<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYMUN 2026 Security Council</title>
  </head>
  <body>
    <div id="app"></div>
    
    <!-- Firebase CDN Scripts -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'
      import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js'
      import { getDatabase, ref, set, get, update, push, child, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js'
      import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js'

      const firebaseConfig = {
        apiKey: "AIzaSyBv7OleZaWKZTJS_TFW2E3u4ln5Rs7nkWo",
        authDomain: "tymun-security-council.firebaseapp.com",
        databaseURL: "https://tymun-security-council-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tymun-security-council",
        storageBucket: "tymun-security-council.firebasestorage.app",
        messagingSenderId: "16719353168",
        appId: "1:16719353168:web:1bb9f60a97641b3babc855"
      }

      const app = initializeApp(firebaseConfig)

      // ✅ 同時掛載到 window.firebase 和 window.auth（確保相容性）
      window.firebase = {
        app,
        auth: getAuth(app),
        db: getDatabase(app),
        storage: getStorage(app),
        authMethods: {
          onAuthStateChanged,
          signInWithEmailAndPassword,
          createUserWithEmailAndPassword,
          signOut
        },
        storageMethods: {
          ref: storageRef,
          uploadBytes,
          getDownloadURL
        },
        dbMethods: { ref, set, get, update, push, child, onValue }
      }

      // ✅ 也直接掛載到 window.auth 方便使用
      window.auth = window.firebase.auth

      console.log('✅ Firebase CDN 已載入')
    </script>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
